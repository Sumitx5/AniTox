<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTox — Search Anime</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>
    <!-- Desktop Header -->
    <header class="main-header">
        <a href="../" class="logo">
            <span class="logo-accent">ANI</span>TOX
        </a>

        <nav class="desktop-nav">
            <a href="../">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>

            <a href="./" class="active">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Search</span>
            </a>

            <a href="../help/">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>Help</span>
            </a>
        </nav>
    </header>

    <!-- Main Search Section -->
    <main class="search-container">
        <!-- Hero Search Header -->
        <div class="search-hero">
            <h1 class="search-heading">Explore <span class="red-text">Anime</span></h1>
            <p class="search-subheading">Discover thousands of anime series, movies, and specials powered by AniList.</p>

            <!-- Search Input Box -->
            <div class="search-box-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search by title (e.g., Solo Leveling, Bleach)..." 
                    autocomplete="off" 
                    spellcheck="false"
                >
                <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear Search" hidden>✕</button>
            </div>

            <!-- Quick Filter Chips -->
            <div class="filter-chips-row">
                <button class="chip active" data-filter="all">All</button>
                <button class="chip" data-filter="TV">TV Series</button>
                <button class="chip" data-filter="MOVIE">Movies</button>
                <button class="chip" data-filter="OVA">OVA</button>
                <button class="chip" data-filter="Action">Action</button>
                <button class="chip" data-filter="Romance">Romance</button>
                <button class="chip" data-filter="Fantasy">Fantasy</button>
            </div>
        </div>

        <!-- Dynamic Results Section -->
        <div class="results-header">
            <h2 id="results-title" class="results-title">Trending Anime</h2>
            <span id="results-count" class="results-count"></span>
        </div>

        <!-- Grid Container -->
        <div id="search-results-grid" class="search-grid"></div>
    </main>

    <!-- Mobile Nav Bar -->
    <nav class="bottom-nav">
        <a href="../">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <a href="./" class="active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </a>

        <a href="../help/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Help</span>
        </a>
    </nav>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="../help/terms/">Terms</a>
            <a href="../help/services/">Services</a>
        </div>
        <p class="copyright">© 2026 TOKITO'S WORLD. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="search.js"></script>
</body>
</html>
