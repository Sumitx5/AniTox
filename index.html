<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="assets/css/main.css">
    <title>AniTox | Official</title>
</head>
<body>
    <!-- Desktop Header -->
    <header class="main-header">
        <a href="./" class="logo">
            <span class="logo-accent">ANI</span>TOX
        </a>

        <nav class="desktop-nav">
            <a href="./" class="active">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>

            <a href="search/">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Search</span>
            </a>

            <a href="../schedule/">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Schedule</span>
            </a>

            <a href="help/">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>Help</span>
            </a>
        </nav>
    </header>

    <!-- Main Data -->
    <main class="container">
        <div class="spotlight" id="spotlight-carousel"></div>

        <div class="card-container">
            <h2 class="card-title"> <span class="red-text">Trending</span> This Week</h2>
            <div class="cards-h">
                <div class="anime-cards" id="trending_this_week"></div>
            </div>
        </div>

        <div class="card-container">
            <h2 class="card-title">Top<span class="red-text"> TV Anime</span></h2>
            <div class="cards-h">
                <div class="anime-cards" id="top_anime"></div>
            </div>
        </div>

        <div class="card-container">
            <h2 class="card-title"><span class="red-text">Top</span> Anime Movies</h2>
            <div class="cards-h">
                <div class="anime-cards" id="top_anime_movies"></div>
            </div>
        </div>

        <div class="card-container">
            <h2 class="card-title"><span class="red-text">New Season</span> Arrivals</h2>
            <div class="cards-h">
                <div class="anime-cards" id="new_season_arrivals"></div>
            </div>
        </div>

        <div class="card-container">
            <h2 class="card-title"><span class="red-text">Action</span> Zone</h2>
            <div class="cards-h">
                <div class="anime-cards" id="action_zone"></div>
            </div>
        </div>

        <div class="card-container">
            <h2 class="card-title"><span class="red-text">Romance & Drama</span></h2>
            <div class="cards-h">
                <div class="anime-cards" id="romance_drama"></div>
            </div>
        </div>

        <div class="card-container">
            <h2 class="card-title"><span class="red-text">Highest Rated</span> Gems</h2>
            <div class="cards-h">
                <div class="anime-cards" id="high_rated_gems"></div>
            </div>
        </div>

    </main>

    <!-- Nav Bar -->
    <nav class="bottom-nav">
        <a href="./" class="active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <a href="search/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </a>

        <a href="schedule/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Schedule</span>
        </a>

        <a href="help/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Help</span>
        </a>
    </nav>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="help/terms/">Terms</a>
            <a href="help/services/">Services</a>
        </div>
        <p class="copyright">© 2026 TOKITO'S WORLD. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
