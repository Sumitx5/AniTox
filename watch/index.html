<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTox Watching: Loading...</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="player.css">
</head>
<body>
    <header class="main-header">
        <a href="../" class="logo">
            <span class="logo-accent">ANI</span>TOX
        </a>

        <nav class="desktop-nav">
            <a href="../">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>

            <a href="../search/">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>Search</span>
            </a>

            <a href="../help/">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>Help</span>
            </a>
        </nav>
    </header>

    <!-- Main Player Container -->
    <main class="player-container">
        <!-- Breadcrumb / Back Link -->
        <div class="player-top-bar">
            <a href="../anime/" id="back-to-anime" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span id="anime-title-label">Anime Details</span>
            </a>
            <span class="playing-badge" id="current-ep-badge">EP 1</span>
        </div>

        <!-- 16:9 Theater Iframe Card -->
        <div class="glass-cinema-card">
            <div class="responsive-video-box">
                <iframe 
                    id="anime-iframe"
                    src=""
                    title="AniTox Stream"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Video Controls Bar -->
        <div class="player-controls-bar">
            <!-- Prev / Next Navigation -->
            <div class="ep-nav-buttons">
                <button id="btn-prev-ep" class="ctrl-btn" aria-label="Previous Episode">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5"></line>
                    </svg>
                    <span>Prev</span>
                </button>
                <button id="btn-next-ep" class="ctrl-btn" aria-label="Next Episode">
                    <span>Next</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19"></line>
                    </svg>
                </button>
            </div>

            <!-- Audio Format (SUB / DUB) -->
            <div class="audio-switch-tabs">
                <span class="ctrl-label">Audio:</span>
                <button class="audio-btn active" data-audio="sub">SUB</button>
                <button class="audio-btn" data-audio="dub">DUB</button>
            </div>

            <!-- Server Selectors -->
            <div class="server-tabs">
                <span class="ctrl-label">Server:</span>
                <!-- Dynamically populated from apis.json -->
            </div>
        </div>

        <!-- Quick Episode Selector Box with 50-Episode Range Selector -->
        <section class="quick-episodes-section">
            <div class="episodes-header-row">
                <h3 class="quick-episodes-title">Episodes</h3>
                <div class="drop-down-selector">
                    <select id="ep-range-select" aria-label="Select Episode Batch"></select>
                </div>
            </div>
            <div class="episodes-grid" id="quick-episode-list"></div>
        </section>
    </main>

    <!-- Mobile Nav Bar -->
    <nav class="bottom-nav">
        <a href="../" class="active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <a href="../search/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </a>

        <a href="../help/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Help</span>
        </a>
    </nav>

    <footer>
        <div class="footer-links">
            <a href="../help/terms/">Terms</a>
            <a href="../help/services/">Services</a>
        </div>
        <p class="copyright">© 2026 TOKITO'S WORLD. ALL RIGHTS RESERVED.</p>
    </footer>
    <script src="watch.js"></script>
</body>
</html>
